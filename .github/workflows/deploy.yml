name: Test and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      backfill_existing_tickets:
        description: Reprocess eligible existing ticket images
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Initialize Convex Auth
        run: node scripts/init-convex-auth.mjs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DRIVERPAY_SITE_URL: https://xgamer791.github.io/truckpay-calculator/
      - name: Deploy Convex backend
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Build web app
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - name: Orient existing ticket images
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_existing_tickets
        run: node scripts/orient-existing-tickets.mjs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Enhance existing ticket images
        run: node scripts/enhance-existing-tickets.mjs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Read eligible tickets from all three plants
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_existing_tickets
        run: node scripts/read-existing-tickets.mjs
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # The currently configured Pages source serves main's root. Keep the
      # existing root fallback and the dist publication equally deployable.
      - name: Publish root reader assets
        run: |
          mkdir -p reader
          cp dist/reader/* reader/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets reader
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified ticket reader assets"
            git push origin HEAD:main
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Rebuild the configured GitHub Pages source
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
